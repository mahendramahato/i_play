# A real upstream pool: nginx resolves each server name once at startup and,
# unlike proxy_pass with a variable, keeps a pool of open connections to them
# (`keepalive`) instead of reconnecting for every request.
# max_fails/fail_timeout: tolerate a couple of transient errors and retry a
# sidelined backend after 10s, instead of dropping it for the long haul.
upstream api-pool {
    least_conn;
    server backend1:8080 max_fails=3 fail_timeout=10s;
    server backend2:8080 max_fails=3 fail_timeout=10s;
    server backend3:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Range headers pass through, so seeking in a song works.
    location /api/ {
        proxy_pass http://api-pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
