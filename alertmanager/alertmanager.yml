global:
  smtp_smarthost: 'smtp.gmail.com:587'
  # Gmail requires the From address to match the authenticated account.
  smtp_from: 'mahendramahato33@gmail.com'
  smtp_auth_username: 'mahendramahato33@gmail.com'
  # Read from a mounted file so the app password never lives in this config
  # (this file is committed; smtp_password.txt is git-ignored).
  smtp_auth_password_file: '/etc/alertmanager/smtp_password.txt'
  smtp_require_tls: true

route:
  receiver: 'email'
  # Collect alerts that fire together into one mail instead of one mail each.
  group_by: ['alertname']
  # Wait this long for more alerts of the same group before sending the first mail.
  group_wait: 5s
  # Wait this long before mailing about NEW alerts added to an existing group.
  group_interval: 5m
  # Re-send a still-firing alert only this often, so an ongoing outage does not
  # mail you every evaluation cycle.
  repeat_interval: 4h

receivers:
  - name: 'email'
    email_configs:
      - to: 'mahendramahato33@gmail.com'
        send_resolved: true
