name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # mvnw lives in backend/, not the repo root.
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run tests
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run build
        run: npm run build

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Pull requests run the tests but must not publish images.
    if: github.ref == 'refs/heads/main'

    # GITHUB_TOKEN is read-only by default; pushing packages needs this.
    permissions:
      contents: read
      packages: write

    # One job definition, run once per image, in parallel.
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: .

    steps:
      - uses: actions/checkout@v5
      # The runner's default docker driver cannot export layer cache; buildx
      # (docker-container driver) is required for cache-to: type=gha.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # :latest for convenience, :<sha> so a bad deploy can be rolled back
          # to an exact, identifiable build.
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          # Reuse layers between runs, otherwise every build recompiles the
          # whole Maven dependency tree from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
