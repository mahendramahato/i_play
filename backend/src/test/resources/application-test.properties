# Layered on top of the main application.properties via @ActiveProfiles("test"),
# so tests never touch a developer's local MySQL or Redis. A file named
# application.properties here would SHADOW the main one entirely and drop
# settings like app.cors-origins.
spring.datasource.url=jdbc:h2:mem:iplay;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

spring.cache.type=none
app.music-dir=${java.io.tmpdir}/iplay-test-music
