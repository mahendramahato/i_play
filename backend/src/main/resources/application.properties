spring.application.name=backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/music}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Bound how long a request can wait on the cache. Without this a Redis outage
# blocks request threads for as long as it lasts.
spring.data.redis.timeout=200ms

# A Redis outage must not mark the app unhealthy: it serves fine from MySQL,
# so an unhealthy verdict here would make nginx sideline working backends.
management.health.redis.enabled=false
spring.cache.redis.time-to-live=60s

app.music-dir=${MUSIC_DIR:./music}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}